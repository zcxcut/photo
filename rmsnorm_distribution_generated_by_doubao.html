// 拆分三组数据
function extract(key){
    let x=[],y=[],z=[],text=[];
    data_raw.forEach(d=>{
        if(d[key]==null) return;
        x.push(d.batch);
        y.push(d.dim);
        z.push(d[key]);
        text.push(`batch=${d.batch}, dim=${d.dim}<br>time=${d[key]} us`);
    });
    return {x,y,z,text};
}

const cpu_float = extract("float_cpu");
const gpu_float = extract("float_gpu");
const gpu_half  = extract("half_gpu");

const traces = [
    {
        name:"float CPU",
        type:"scatter3d",
        mode:"markers",
        x:cpu_float.x, y:cpu_float.y, z:cpu_float.z,
        text:cpu_float.text, hovertemplate:"%{text}<extra></extra>",
        marker:{size:4, color:"#1f77b4", opacity:0.8}
    },
    {
        name:"float GPU",
        type:"scatter3d",
        mode:"markers",

];

const layout = {

    scene:{

        yaxis:{title:"Hidden Dimension"},
        zaxis:{title:"耗时 us", type:"log"},

    width:1400,
    height:900
};

Plotly.newPlot(document.getElementById("graph"), traces, layout);
